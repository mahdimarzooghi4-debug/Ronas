name: Core slices prototype checks
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'sprint/**'
  pull_request:
    branches:
      - main
      - business/ronas-foundation-v0-1
      - 'feat/**'
      - 'fix/**'
      - 'sprint/**'

permissions:
  contents: read

jobs:
  prototype-contracts:
    name: Python and Node synthetic workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s prototype/tests -v
      - run: python -m compileall -q prototype/ronas_core
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test prototype/tests/test_demo_model.mjs

  secure-api-contracts:
    name: Python 3.12 Keycloak JWKS and client-role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ronas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ronas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RONAS_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ronas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pip check
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: PYTHONPATH=backend python -m compileall -q backend/ronas_api
