[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ronas-foundation"
version = "0.1.0"
description = "Ronas read-only dual-engine design foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["ronas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
