name: Ronas Foundation CI

on:
  push:
    branches:
      - "technical/**"
  pull_request:
    branches:
      - main
      - "business/**"
      - "technical/**"

permissions:
  contents: read

jobs:
  backend-contract:
    name: Backend Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install foundation and test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Run contract and boundary tests
        run: python -m pytest backend/tests -q
      - name: Validate Python syntax
        run: python -m compileall -q backend/ronas
